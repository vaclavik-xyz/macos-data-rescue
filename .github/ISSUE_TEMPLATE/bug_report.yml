name: Bug report
description: Report a reproducible problem using synthetic data only
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include customer data, manifests, reports, names, real paths, filenames, screenshots, or volume identifiers. Use a synthetic reproduction. Report vulnerabilities privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Python version
      placeholder: macOS 15.5, Python 3.11.13
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal commands and synthetic fixture setup.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all customer data and identifying details from this report.
          required: true
