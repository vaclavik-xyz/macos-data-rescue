<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">macOS Data Rescue — Rescue Manifesto</title>
  <desc id="desc">Dark open graph image emphasizing that one bad file must not stop a data rescue.</desc>
  <rect width="1200" height="630" fill="#0b1730"/>

  <g fill="none" stroke="#1e3558" stroke-width="2">
    <ellipse cx="930" cy="266" rx="238" ry="206"/>
    <ellipse cx="930" cy="266" rx="202" ry="170"/>
    <ellipse cx="930" cy="266" rx="166" ry="134"/>
  </g>
  <path d="M676 58v400" stroke="#223a5c" stroke-width="2"/>

  <rect x="70" y="58" width="11" height="11" fill="#27cda5"/>
  <text x="98" y="70" fill="#8fe3d0" font-family="Menlo, monospace" font-size="16" font-weight="700" letter-spacing="2">macOS DATA RESCUE</text>
  <rect x="433" y="48" width="172" height="31" rx="15.5" fill="#142947"/>
  <text x="451" y="69" fill="#ffc84a" font-family="Menlo, monospace" font-size="13" font-weight="700" letter-spacing="1.5">OPEN SOURCE CLI</text>

  <text x="68" y="182" fill="#f5fbff" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="74" font-weight="800" letter-spacing="-3">ONE BAD FILE</text>
  <text x="68" y="258" fill="#f5fbff" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="74" font-weight="800" letter-spacing="-3">MUST NOT STOP</text>
  <text x="68" y="334" fill="#ffc84a" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="74" font-weight="800" letter-spacing="-3">THE RESCUE.</text>
  <text x="72" y="392" fill="#bed0dc" font-family="Avenir Next, Helvetica Neue, sans-serif" font-size="23">Resumable, atomic file recovery for damaged Macs.</text>
  <path d="M72 428h528" stroke="#27cda5" stroke-width="4"/>

  <g transform="translate(758 94) scale(5.35)">
    <rect width="64" height="64" rx="14" fill="#101f3d" stroke="#2e4a71" stroke-width="1"/>
    <path d="M11 22c0-5.3 9.4-9.5 21-9.5S53 16.7 53 22v19c0 5.8-9.4 10.5-21 10.5S11 46.8 11 41V22Z" fill="#f5fbff"/>
    <ellipse cx="32" cy="22" rx="21" ry="9.5" fill="#8fe3d0"/>
    <ellipse cx="32" cy="22" rx="11" ry="4.2" fill="#0b1730"/>
    <path d="M12 35c4.2 4 11.5 6.2 20 6.2 8.1 0 15.1-2 19.4-5.7" fill="none" stroke="#9cb2c1" stroke-width="3"/>
    <circle cx="47" cy="46" r="11.5" fill="#ffc84a" stroke="#0b1730" stroke-width="3"/>
    <path d="m41.8 45.8 3.5 3.4 6.8-7.2" fill="none" stroke="#0b1730" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M0 496h1200v134H0Z" fill="#f5fbff"/>
  <text x="70" y="538" fill="#0f725e" font-family="Menlo, monospace" font-size="12" font-weight="700" letter-spacing="1.5">SAFE DATA PATH</text>
  <circle cx="72" cy="574" r="7" fill="#27cda5"/>
  <text x="93" y="581" fill="#0b1730" font-family="Menlo, monospace" font-size="17" font-weight="700">SOURCE</text>
  <text x="93" y="607" fill="#607685" font-family="Menlo, monospace" font-size="12">READ ONLY</text>
  <path d="M205 574h104" stroke="#8ba2af" stroke-width="3"/>
  <path d="m299 565 16 9-16 9Z" fill="#8ba2af"/>
  <circle cx="339" cy="574" r="7" fill="#ffc84a"/>
  <text x="360" y="581" fill="#0b1730" font-family="Menlo, monospace" font-size="17" font-weight="700">MANIFEST</text>
  <text x="360" y="607" fill="#607685" font-family="Menlo, monospace" font-size="12">SQLITE</text>
  <path d="M499 574h104" stroke="#8ba2af" stroke-width="3"/>
  <path d="m593 565 16 9-16 9Z" fill="#8ba2af"/>
  <circle cx="633" cy="574" r="7" fill="#27cda5"/>
  <text x="654" y="581" fill="#0b1730" font-family="Menlo, monospace" font-size="17" font-weight="700">DESTINATION</text>
  <text x="654" y="607" fill="#607685" font-family="Menlo, monospace" font-size="12">VERIFIED</text>
  <text x="1128" y="581" fill="#607685" text-anchor="end" font-family="Menlo, monospace" font-size="15">github.com/vaclavik-xyz/</text>
  <text x="1128" y="605" fill="#0b1730" text-anchor="end" font-family="Menlo, monospace" font-size="15" font-weight="700">macos-data-rescue</text>
</svg>
